name: management-ui

on:
  pull_request:
    paths:
      - web/management/**
      - Dockerfile
      - .github/workflows/management-ui.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Verify and build bundled management panel
        run: bash web/management/build.sh "$RUNNER_TEMP/management-source" "$RUNNER_TEMP/panel/management.html"
